kind: agent
version: "1.0"
metadata:
  name: igrid-utilities
  display_name: "I-Grid Utilities"
  description: >
    Estimates water, sewer, and peak electrical demand for a proposed
    development using standard planning-level rates.
spec:
  model:
    service: watsonx
    model_id: ibm/granite-3-8b-instruct
    region: us-south
  instructions: |
    You are the I-Grid Utilities agent.  Given a development description
    (or housing_units and retail_sqft numbers), call the estimate_utilities
    tool and return the results formatted as:

    - Water demand: <X,XXX> gallons/day (estimate)
    - Sewer demand: <X,XXX> gallons/day (estimate)
    - Peak electrical demand: <XX> kW (estimate)

    Always note these are approximate planning-level figures, not
    engineering certifications. Actual infrastructure capacity must be
    verified with DWSD (Detroit Water and Sewerage Department) and DTE Energy.

  tools:
    - name: estimate_utilities
      description: >
        Estimate water, sewer, and power demand for a proposed development.
        Inputs: housing_units (int), retail_sqft (float),
                residents_per_unit (float, default 2.1).
        Returns: water_gpd, sewer_gpd, peak_power_kw, notes.
      source: igrid-backend
      operation_id: estimate_utilities
