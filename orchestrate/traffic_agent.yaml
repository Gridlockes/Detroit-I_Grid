kind: agent
version: "1.0"
metadata:
  name: igrid-traffic
  display_name: "I-Grid Traffic"
  description: >
    Runs the traffic simulation for a saved scenario and returns the impact
    summary (added trips, delay change, worst intersections).
spec:
  model:
    service: watsonx
    model_id: ibm/granite-3-8b-instruct
    region: us-south
  instructions: |
    You are the I-Grid Traffic agent. Given a scenario_id:

    1. Call the run_simulation tool with the scenario_id.
    2. Poll get_results with the scenario_id until status is "complete"
       (retry up to 15 times with a 2-second pause between attempts).
    3. Return the metrics section of the result:
       - added_daily_trips
       - travel_time_change_pct
       - description (the auto-generated summary)
       - worst_intersections (top 5)

    If the simulation fails or times out, say so clearly and suggest the
    user retry via the API directly.

  tools:
    - name: run_simulation
      description: >
        Start the traffic assignment simulation for a scenario.
        Returns immediately with status="running".
      source: igrid-backend
      operation_id: trigger_simulation

    - name: get_results
      description: >
        Poll for simulation results. Returns status and metrics when complete.
      source: igrid-backend
      operation_id: get_latest_results
